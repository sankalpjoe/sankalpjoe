name: Refresh profile

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile.json'
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: read

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sankalpjoe/sankalpjoe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public repositories and render original artwork
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh.py
      - name: Verify generated files and data handling
        run: python -m unittest discover -s tests -v
      - name: Save refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md assets data/public-repos.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh public repository profile"
          git push origin HEAD:main
