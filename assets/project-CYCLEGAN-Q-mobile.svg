<svg xmlns="http://www.w3.org/2000/svg" width="600" height="535" viewBox="0 0 600 535" role="img" aria-labelledby="title desc"><title id="title">CycleGAN-Q</title><desc id="desc">Hybrid quantum and classical generators for unpaired day-to-night image translation. Technologies: Qiskit, PyTorch, Image translation. Illustration is conceptual.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}.cipher{stroke-dasharray:6 10;animation:cipher 5s linear infinite}.travel{animation:travel 7s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cipher{to{stroke-dashoffset:-64}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(260px);opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.cipher,.travel{animation:none}}</style><rect x=".5" y=".5" width="599" height="534" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="37" font-family="'Courier New', monospace" font-size="12" fill="#91c7ff" font-weight="400" letter-spacing="1">03 / HYBRID MACHINE LEARNING</text><text x="572" y="37" font-family="'Courier New', monospace" font-size="16" fill="#a4b1bf" font-weight="400" text-anchor="end">↗</text><g transform="translate(133 55) scale(1.05)"><circle cx="168" cy="97" r="140" fill="url(#glow)" /><ellipse cx="106" cy="95" rx="28" ry="48.0" fill="none" stroke="#91c7ff" opacity="0.15"/><ellipse cx="106" cy="95" rx="30" ry="50.5" fill="none" stroke="#91c7ff" opacity="0.185"/><ellipse cx="106" cy="95" rx="32" ry="53.0" fill="none" stroke="#91c7f