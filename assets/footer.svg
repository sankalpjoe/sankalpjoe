<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="206" viewBox="0 0 1200 206" role="img" aria-labelledby="title desc"><title id="title">Let&#x27;s compare notes — Sankalp Joshi on GitHub</title><desc id="desc"></desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}.cipher{stroke-dasharray:6 10;animation:cipher 5s linear infinite}.travel{animation:travel 7s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cipher{to{stroke-dashoffset:-64}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(260px);opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.cipher,.travel{animation:none}}</style><rect x=".5" y=".5" width="1199" height="205" rx="20" fill="#090d14" stroke="#26323d"/><text x="32" y="39" font-family="'Courier New', monospace" font-size="12" fill="#c5f58a" font-weight="400" letter-spacing="1">NEXT / AN INTERESTING PROBLEM</text><text x="30" y="97" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#f1f0e8" font-weight="700" >Let&#x27;s compare notes.</text><text x="32" y="137" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a4b1bf" font-weight="400" >Quantum ideas. Generative models. Useful things.</text><path d="M32,158 L1168,158" stroke="#26323d" fill="none" /><text x="32" y="186" font-family="'Courier New', monospace" font-size="12" fill="#a4b1bf" font-weight="400" >SANKALP JOSHI</text><text x="1168" y="186" font-family="'Courier New', monospace" font-size="12" fill="#c5f58a" font-we