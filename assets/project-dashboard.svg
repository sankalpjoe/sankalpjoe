<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc"><title id="title">DASHINT</title><desc id="desc">An India crisis monitor combining news, civic signals, weather and LLM analysis across five cities. Technologies: OSINT, JavaScript / TypeScript, LLM pipelines. Illustration is conceptual.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect x=".5" y=".5" width="1199" height="271" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="37" font-family="'Courier New', monospace" font-size="12" fill="#c5f58a" font-weight="400" letter-spacing="1">01 / APPLIED AI</text><text x="1172" y="37" font-family="'Courier New', monospace" font-size="16" fill="#a4b1bf" font-weight="400" text-anchor="end">↗</text><text x="32" y="88" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f1f0e8" font-weight="700" letter-spacing="-.8">DASHINT</text><text x="33" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c5f58a" font-weight="400" >Turning information into situational awareness.</text><text x="33" y="162" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a4b1bf" font-weight="400" >An India crisis monitor combining news, civic signals, weather and LLM</text><text x="33" y="186" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a4b1bf" font-weight="400" >analysis across five cities.</text><text x="33" y="240" font-family="'Courier New', monospace" font-size="13" fill="#a4b1bf" font-weight="400" >OSINT / JavaScript / TypeScript / LLM pipelines</text><path d="M828,64 L828,239" stroke="#26323d" fill="none" /><g transform="translate(852 52)"><circle cx="168" cy="97" r="140" fill="url(#glow)" /><circle cx="167" cy="96" r="28" fill="none" stroke="#c5f58a" stroke-opacity=".27"/><circle cx="167" cy="96" r="55" fill="none" stroke="#c5f58a" stroke-opacity=".27"/><circle cx="167" cy="96" r="82" fill="none" stroke="#c5f58a" stroke-opacity=".27"/><path d="M68,96 L266,96" stroke="#26323d" fill="none" /><path d="M167,1 L167,189" stroke="#26323d" fill="none" /><g class="pulse"><circle cx="121" cy="56" r="10" fill="#c5f58a" opacity=".08"/><circle cx="121" cy="56" r="3" fill="#c5f58a" /><circle cx="203" cy="76" r="10" fill="#c5f58a" opacity=".08"/><circle cx="203" cy="76" r="3" fill="#c5f58a" /><circle cx="185" cy="123" r="10" fill="#c5f58a" opacity=".08"/><circle cx="185" cy="123" r="3" fill="#c5f58a" /><circle cx="128" cy="133" r="10" fill="#c5f58a" opacity=".08"/><circle cx="128" cy="133" r="3" fill="#c5f58a" /><circle cx="224" cy="132" r="10" fill="#c5f58a" opacity=".08"/><circle cx="224" cy="132" r="3" fill="#c5f58a" /></g><path d="M167.00,96.00 L208.00,24.00 L244.00,59.00" fill="none" stroke="#c5f58a" stroke-width="1" opacity="0.7"/><text x="12" y="176" font-family="'Courier New', monospace" font-size="10" fill="#a4b1bf" font-weight="400" >05 CITIES / SIGNAL → CONTEXT</text></g></svg>
