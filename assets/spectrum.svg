<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Code spectrum</title><desc id="desc">GitHub language bytes; notebooks include JSON and outputs. Excludes forks, archived repositories and this profile.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}.cipher{stroke-dasharray:6 10;animation:cipher 5s linear infinite}.travel{animation:travel 7s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cipher{to{stroke-dashoffset:-64}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(260px);opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.cipher,.travel{animation:none}}</style><rect x=".5" y=".5" width="1199" height="339" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="39" font-family="'Courier New', monospace" font-size="13" fill="#c5f58a" font-weight="400" letter-spacing="1">CODE SPECTRUM</text><text x="28" y="79" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f1f0e8" font-weight="700" >What the public projects are made of.</text><rect x="28.00" y="110" width="515.93" height="16" fill="#b9a4ff"/><rect x="543.93" y="110" width="497.08" height="16" fill="#c5f58a"/><rect x="1041.01" y="110" width="122.97" height="16" fill="#91c7ff"/><rect x="1163.98" y="110" width="7.95" height="16" fill="#e7ba83"/><rect x="1171.93" y="110" width="0.07" height="16" fill="#e998bc"/><circle cx="34" cy="169" r="4" fill="#b9a4ff" /><text x="47" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Jupyter Notebook</text><text x="47" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >45.1%</text><circle cx="422" cy="169" r="4" fill="#c5f58a" /><text x="435" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >HTML</text><text x="435" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >43.5%</text><circle cx="810" cy="169" r="4" fill="#91c7ff" /><text x="823" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Python</text><text x="823" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >10.7%</text><circle cx="34" cy="227" r="4" fill="#e7ba83" /><text x="47" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >TeX</text><text x="47" y="254" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >0.7%</text><circle cx="422" cy="227" r="4" fill="#e998bc" /><text x="435" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Batchfile</text><text x="435" y="254" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >&lt;0.1%</text><text x="28" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >GitHub language bytes; notebooks include JSON and outputs.</text><text x="28" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >Excludes forks, archived repositories and this profile.</text></svg>
