<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Code spectrum</title><desc id="desc">GitHub language bytes; notebooks include JSON and outputs. Excludes forks, archived repositories and this profile.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect x=".5" y=".5" width="1199" height="339" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="39" font-family="'Courier New', monospace" font-size="13" fill="#c5f58a" font-weight="400" letter-spacing="1">CODE SPECTRUM</text><text x="28" y="79" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f1f0e8" font-weight="700" >What the public projects are made of.</text><rect x="28.00" y="110" width="523.72" height="16" fill="#b9a4ff"/><rect x="551.72" y="110" width="254.67" height="16" fill="#c5f58a"/><rect x="806.39" y="110" width="205.23" height="16" fill="#91c7ff"/><rect x="1011.62" y="110" width="131.73" height="16" fill="#e7ba83"/><rect x="1143.35" y="110" width="20.78" height="16" fill="#e998bc"/><rect x="1164.13" y="110" width="7.87" height="16" fill="#7e8d9d"/><circle cx="34" cy="169" r="4" fill="#b9a4ff" /><text x="47" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Jupyter Notebook</text><text x="47" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >45.8%</text><circle cx="422" cy="169" r="4" fill="#c5f58a" /><text x="435" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >JavaScript</text><text x="435" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >22.3%</text><circle cx="810" cy="169" r="4" fill="#91c7ff" /><text x="823" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >TypeScript</text><text x="823" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >17.9%</text><circle cx="34" cy="227" r="4" fill="#e7ba83" /><text x="47" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Python</text><text x="47" y="254" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >11.5%</text><circle cx="422" cy="227" r="4" fill="#e998bc" /><text x="435" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Rust</text><text x="435" y="254" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >1.8%</text><circle cx="810" cy="227" r="4" fill="#7e8d9d" /><text x="823" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Other</text><text x="823" y="254" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >0.7%</text><text x="28" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >GitHub language bytes; notebooks include JSON and outputs.</text><text x="28" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >Excludes forks, archived repositories and this profile.</text></svg>
