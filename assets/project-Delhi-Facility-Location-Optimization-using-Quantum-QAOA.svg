<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc"><title id="title">Where should a city build?</title><desc id="desc">Facility placement on a synthetic Delhi dataset, comparing QAOA in Qiskit and PennyLane. Technologies: QAOA, PennyLane, Synthetic urban data. Illustration is conceptual.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}.cipher{stroke-dasharray:6 10;animation:cipher 5s linear infinite}.travel{animation:travel 7s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cipher{to{stroke-dashoffset:-64}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(260px);opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.cipher,.travel{animation:none}}</style><rect x=".5" y=".5" width="1199" height="271" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="37" font-family="'Courier New', monospace" font-size="12" fill="#c5f58a" font-weight="400" letter-spacing="1">06 / QUANTUM OPTIMIZATION</text><text x="1172" y="37" font-family="'Courier New', monospace" font-size="16" fill="#a4b1bf" font-weight="400" text-anchor="end">↗</text><text x="32" y="88" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f1f0e8" font-weight="700" letter-spacing="-.8">Where should a city build?</text><text x="33" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c5f58a" font-weight="400" >Quantum optimization, at the scale of a city.