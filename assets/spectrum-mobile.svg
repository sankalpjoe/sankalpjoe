<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">Code spectrum</title><desc id="desc">GitHub language bytes; notebooks include JSON and outputs. Excludes forks, archived repositories and this profile.</desc><defs><radialGradient id="glow"><stop stop-color="#9f88ff" stop-opacity=".18"/><stop offset="1" stop-color="#090d14" stop-opacity="0"/></radialGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#c5f58a"/><stop offset=".5" stop-color="#9bc5ec"/><stop offset="1" stop-color="#b9a4ff"/></linearGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:turn 60s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}.cipher{stroke-dasharray:6 10;animation:cipher 5s linear infinite}.travel{animation:travel 7s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.35}}@keyframes cipher{to{stroke-dashoffset:-64}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(260px);opacity:0}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.cipher,.travel{animation:none}}</style><rect x=".5" y=".5" width="599" height="419" rx="20" fill="#090d14" stroke="#26323d"/><text x="28" y="39" font-family="'Courier New', monospace" font-size="13" fill="#c5f58a" font-weight="400" letter-spacing="1">CODE SPECTRUM</text><text x="28" y="79" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f1f0e8" font-weight="700" >What the public projects are made of.</text><rect x="28.00" y="110" width="248.21" height="16" fill="#b9a4ff"/><rect x="276.21" y="110" width="239.15" height="16" fill="#c5f58a"/><rect x="515.36" y="110" width="53.56" height="16" fill="#91c7ff"/><rect x="568.92" y="110" width="3.04" height="16" fill="#e7ba83"/><rect x="571.97" y="110" width="0.03" height="16" fill="#e998bc"/><circle cx="34" cy="169" r="4" fill="#b9a4ff" /><text x="47" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Jupyter Notebook</text><text x="47" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >45.6%</text><circle cx="318" cy="169" r="4" fill="#c5f58a" /><text x="331" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >HTML</text><text x="331" y="196" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >44.0%</text><circle cx="34" cy="240" r="4" fill="#91c7ff" /><text x="47" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Python</text><text x="47" y="267" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >9.8%</text><circle cx="318" cy="240" r="4" fill="#e7ba83" /><text x="331" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >TeX</text><text x="331" y="267" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >0.6%</text><circle cx="34" cy="311" r="4" fill="#e998bc" /><text x="47" y="316" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f1f0e8" font-weight="400" >Batchfile</text><text x="47" y="338" font-family="'Courier New', monospace" font-size="14" fill="#a4b1bf" font-weight="400" >&lt;0.1%</text><text x="28" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >GitHub language bytes; notebooks include JSON and outputs.</text><text x="28" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a4b1bf" font-weight="400" >Excludes forks, archived repositories and this profile.</text></svg>
